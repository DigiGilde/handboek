name: Publiceer PR preview voor Digi Handboek

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  id-token: write
  deployments: write
  pull-requests: write

concurrency:
  group: plak-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set preview site URL
        if: github.event.action != 'closed'
        run: echo "SITE_URL=https://plak.rijks.app/digigilde/handboek/_preview/pr-${{ github.event.number }}/" >> "$GITHUB_ENV"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
        if: github.event.action != 'closed'
      - uses: actions/cache@v6
        if: github.event.action != 'closed'
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: github.event.action != 'closed'
        run: uv python install
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: uv sync --locked --no-dev
      - name: Build preview
        if: github.event.action != 'closed'
        run: uv run mkdocs build
      - uses: actions/upload-artifact@v7
        if: github.event.action != 'closed'
        with:
          name: digihandboek-preview-pr-${{github.event.number}}
          path: ./site/
      # A fork gets no OIDC token; bot PRs are skipped by the action itself.
      - name: Publish or clean up preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: DigiGilde/plak/actions/publish@20b57eba2a96eb0c5a37d07b6d33de1feeac2873 # v2026.10.4
        with:
          site: digigilde/handboek
          dist-path: site
          preview-ref: pr-${{ github.event.number }}
          teardown: ${{ github.event.action == 'closed' }}
          environment: preview
          comment-on-pr: "true"
