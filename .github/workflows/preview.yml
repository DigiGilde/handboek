name: Publiceer PR preview voor Digi Handboek

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  id-token: write
  deployments: write
  pull-requests: write

concurrency:
  group: toon-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set preview site URL
        if: github.event.action != 'closed'
        run: echo "SITE_URL=https://toon.rijks.app/digigilde/handboek/_preview/pr-${{ github.event.number }}/" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action != 'closed'
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci --omit=dev
      - name: Build preview
        if: github.event.action != 'closed'
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event.action != 'closed'
        with:
          name: digihandboek-preview-pr-${{github.event.number}}
          path: ./dist/
      # A fork gets no OIDC token; bot PRs are skipped by the action itself.
      - name: Publish or clean up preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: DigiGilde/toon/actions/publish@8da2d7a7be607cd708471df5c12963f667faedec # v2026.11.2.1
        with:
          site: digigilde/handboek
          dist-path: dist
          preview-ref: pr-${{ github.event.number }}
          teardown: ${{ github.event.action == 'closed' }}
          environment: preview
          comment-on-pr: "true"
