name: Publiceer Digi Handboek

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Build site
        run: uv run mkdocs build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          clean: true
      - name: Build site for Plak
        run: uv run mkdocs build
        env:
          SITE_URL: https://plak.rijks.app/digigilde/handboek/
      - name: Publish copy to Plak
        uses: DigiGilde/plak/actions/publish@20b57eba2a96eb0c5a37d07b6d33de1feeac2873 # v2026.10.4
        with:
          site: digigilde/handboek
          dist-path: site
          environment: plak
