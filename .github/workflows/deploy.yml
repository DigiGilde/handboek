name: Publiceer Digi Handboek

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: publish

jobs:
  zad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Build site
        run: npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Containerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/digigilde/handboek:${{ github.sha }}
      # No domain-format: the hostname is fixed in the ZAD project config.
      - name: Deploy to ZAD
        uses: RijksICTGilde/zad-actions/deploy@428dc1e446dcf30db3b356f27c7c5073bae28f48 # v4.3.1
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: production
          component: web
          image: ghcr.io/digigilde/handboek:${{ github.sha }}
          # GitHub Pages only redirects once the new site answers.
          wait-for-ready: 'true'
          health-endpoint: /healthz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/

  github-pages:
    needs: zad
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      # ZAD answers on its cluster address before the subdomain is approved;
      # redirect only once the public address itself answers.
      - name: Check that digihandboek.rijks.app answers
        run: curl --fail --silent --show-error --retry 10 --retry-delay 30 --retry-all-errors https://digihandboek.rijks.app/healthz
      - name: Build redirect for GitHub Pages
        run: scripts/github-pages-redirect.sh dist github-pages https://digihandboek.rijks.app/
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: github-pages
          clean: true

  plak:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Build site for Plak
        run: npm run build
        env:
          SITE_URL: https://plak.rijks.app/digigilde/handboek/
      - name: Publish copy to Plak
        uses: DigiGilde/plak/actions/publish@20b57eba2a96eb0c5a37d07b6d33de1feeac2873 # v2026.10.4
        with:
          site: digigilde/handboek
          dist-path: dist
          environment: plak
