name: Publiceer Digi Handboek

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Build site
        run: npm run build
        env:
          SITE_URL: https://digigilde.github.io/handboek/
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          clean: true
      - name: Build site for Plak
        run: npm run build
        env:
          SITE_URL: https://plak.rijks.app/digigilde/handboek/
      - name: Publish copy to Plak
        uses: DigiGilde/plak/actions/publish@20b57eba2a96eb0c5a37d07b6d33de1feeac2873 # v2026.10.4
        with:
          site: digigilde/handboek
          dist-path: dist
          environment: plak
