# Based on the nginx.conf of ghcr.io/rijksictgilde/nginx-base. Differences:
# directory URLs redirect to a trailing slash, and only fingerprinted assets
# (Astro's _astro/) are cached long-term.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Behind the ZAD ingress nginx only sees port 8080 and plain HTTP; a
        # relative Location keeps the redirect on the public host and scheme.
        absolute_redirect off;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location ~ /\.(?!well-known) {
            return 404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Every page is a directory (trailingSlash: 'always'), so /foo must
        # become /foo/ before foo/index.html is served.
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;

        # Astro writes scripts, styles, fonts and icons to _astro/ with a
        # content hash in the name; everything else, Pagefind's index
        # included, keeps its name across releases.
        location /_astro/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
